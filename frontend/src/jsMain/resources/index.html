<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #root { width: 100%; }

        /* Board grid cell */
        .board-cell {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 3px solid #0055cc;
            background: #0a0a1a;
        }

        /* Piece animation on placement */
        .piece-X {
            background: #e53935;
            animation: fall-in 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .piece-O {
            background: #fdd835;
            animation: fall-in 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fall-in {
            from { transform: translateY(-300%); opacity: 0.4; }
            to   { transform: translateY(0);     opacity: 1;   }
        }

        /* Responsive: shrink cells on small screens */
        @media (max-width: 600px) {
            .board-cell { width: 40px; height: 40px; border-width: 2px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="connect4.js"></script>
</body>
</html>
